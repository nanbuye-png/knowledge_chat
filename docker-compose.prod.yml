version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_chat}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge_network

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: knowledge-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env.production
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knowledge_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: knowledge-worker
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.services.tasks.worker
    networks:
      - knowledge_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: knowledge-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - knowledge_network

  nginx:
    image: nginx:alpine
    container_name: knowledge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - knowledge_network

networks:
  knowledge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  chroma_data: