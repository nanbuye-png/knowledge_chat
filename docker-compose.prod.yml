services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_chat}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge_network

  redis:
    image: redis:7-alpine
    container_name: knowledge-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knowledge_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ghcr.io/nanbuye-png/knowledge_chat/backend:1.0.1
    container_name: knowledge-backend
    restart: unless-stopped
    expose:
      - "8000"
    # 用户真实配置（cp .env.production .env.production.local 后编辑）
    env_file:
      - .env.production.local
    volumes:
      - uploads_data:/app/uploads
      - chroma_data:/app/chroma_db
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knowledge_network

  # ============================================================
  # Worker：默认不启用。
  # WORKER_BACKEND=local 时，文档嵌入等异步任务在 API 进程内执行，
  # 无需独立 Worker 进程。未来切换 Celery 后可在此启用独立 Worker。
  # ============================================================
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.backend
  #   container_name: knowledge-worker
  #   restart: unless-stopped
  #   env_file:
  #     - .env.production.local
  #   volumes:
  #     - uploads_data:/app/uploads
  #     - chroma_data:/app/chroma_db
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   command: python -m app.services.tasks.worker
  #   networks:
  #     - knowledge_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ghcr.io/nanbuye-png/knowledge_chat/frontend:1.0.1
    container_name: knowledge-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - knowledge_network

  nginx:
    image: nginx:alpine
    container_name: knowledge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 如启用 HTTPS，取消注释并配置证书挂载（见 nginx/nginx.ssl.conf）
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS 证书挂载（启用 SSL 时取消注释）
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - knowledge_network

networks:
  knowledge_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  chroma_data: