# knowledge_chat Nginx HTTPS 配置模板
# 使用方法：
#   1. 将证书放置于 ./certs/ 目录（fullchain.pem / privkey.pem）
#   2. 在 docker-compose.prod.yml 中取消 nginx 服务的 443 端口与 ./certs 挂载注释
#   3. 将本文件挂载为 /etc/nginx/conf.d/default.conf 替换 nginx.conf
#   4. 重启服务：docker compose -f docker-compose.prod.yml up -d

# SSE / 流式响应需要的连接升级映射（审计 §7.5-2：不能无条件 Connection: upgrade）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 审计 §7.5-1（P0 功能）：应用侧 MAX_FILE_SIZE=50MB，Nginx 默认只有 1m，
# 两边不一致会让 >1MB 的上传直接 413。放在 http 层，两个 server 都生效。
client_max_body_size 50m;

upstream backend {
    server backend:8000;
    keepalive 64;
}

upstream frontend {
    server frontend:80;
}

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name your-domain.com;

    # 除健康检查外全部跳转 HTTPS
    # 审计 §7.5-4：原来这里是 proxy_pass 配一个直接 return 的固定响应 ——
    # return 优先且不发请求，探针永远绿。改为真正转发到后端 /api/health。
    location = /health {
        proxy_pass http://backend/api/health;
        access_log off;
        proxy_read_timeout 10s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================
    # Gzip 压缩
    # ============================================================
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # ============================================================
    # 日志格式
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # Proxy 基础设置
    # ============================================================
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 审计 §7.5-3：不要用 nginx 内置的 proxy_add_x_forwarded_for（保留客户端
    # 伪造的前置值）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout 设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ============================================================
    # API 代理：/api -> Backend
    # ============================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ============================================================
    # 静态文件代理 -> Frontend
    # ============================================================
    location / {
        proxy_pass http://frontend;
        # 静态资源不需要 Upgrade/Connection: upgrade（审计 §7.5-2）

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}