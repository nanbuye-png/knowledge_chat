# SSE / 流式响应需要的连接升级映射。
# 审计 §7.5-2：原来在 /api/ 上无条件写 `Connection: upgrade`，普通请求也被
# 当成升级请求 → 上游 keepalive 失效（每次请求新建连接）。改成按 Upgrade 头判断。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8000;
    keepalive 64;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # 审计 §7.5-1（P0 功能）：全仓库此前没有 client_max_body_size，Nginx 默认
    # 1m，而应用侧 MAX_FILE_SIZE=50MB（core/config.py）→ 经 Nginx 上传 >1MB
    # 的文件直接 413。两边必须一致。
    client_max_body_size 50m;

    # ============================================================
    # Gzip 压缩
    # ============================================================
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # ============================================================
    # 日志格式
    # ============================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ============================================================
    # Proxy 基础设置
    # ============================================================
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 审计 §7.5-3：不能用 nginx 内置的 proxy_add_x_forwarded_for —— 它会把
    # 客户端自带的 X-Forwarded-For 前置值原样保留，任何人都能伪造 IP 绕过限流。
    # 只写我们真正看到的对端地址；应用侧按 TRUSTED_PROXY_COUNT 取右数第 N 跳。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout 设置
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;

    # ============================================================
    # API 代理：/api -> Backend
    # ============================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ============================================================
    # 静态文件代理 -> Frontend
    # ============================================================
    location / {
        proxy_pass http://frontend;
        # 前端是静态文件服务，不需要 Upgrade/Connection: upgrade
        # （审计 §7.5-2：无条件 upgrade 会破坏 keepalive，对静态资源毫无意义）

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ============================================================
    # 健康检查端点
    # ============================================================
    # 审计 §7.5-4：原来是 proxy_pass 配一个直接 return 的固定响应 —— Nginx 里
    # return 优先且根本不发请求，这个端点永远返回成功，探针形同虚设。
    # 现在真正转发到后端 /api/health（数据库/向量库/LLM 的真实探测结果）。
    location = /health {
        proxy_pass http://backend/api/health;
        access_log off;
        proxy_read_timeout 10s;
    }

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}