# 前端容器内的 Nginx 配置（构建时 COPY 进镜像，见 Dockerfile.frontend）。
#
# 为什么需要：根目录 nginx/nginx.conf 是**外层**代理（把 / 反代到 frontend:80），
# 它不会给 SPA 做回退；前端容器若用官方默认配置，刷新 /knowledge/123 这类深链接
# 会直接 404（审计 §7.1-4）。这里把未知路径回退到 /index.html，交给前端路由。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html 必须每次回源校验：否则发版后用户仍被缓存的旧入口文件钉住，
    # 加载的是已删除的 chunk。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带 hash 的构建产物可以长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 回退（深链接刷新的关键一行）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 容器 HEALTHCHECK 用（见 Dockerfile.frontend）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
