apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledge-config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DATABASE_TYPE: "postgresql"
  POSTGRES_HOST: "knowledge-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "knowledge_chat"
  REDIS_HOST: "knowledge-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_URL: "redis://knowledge-redis:6379/0"
  LLM_PROVIDER: "deepseek"
  DEEPSEEK_API_BASE: "https://api.deepseek.com"
  CACHE_BACKEND: "redis"
  WORKER_BACKEND: "local"
  CORS_ORIGINS: '["http://localhost","https://your-domain.com"]'