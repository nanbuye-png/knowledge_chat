apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-backend
  labels:
    app: knowledge-backend
spec:
  # 审计 §7.3-2（架构矛盾）：本项目的向量库是**本地 ChromaDB PersistentClient**，
  # 数据落在每个 Pod 自己的 /app/chroma_db 里。扩到 2 个副本不是"更稳"，而是
  # 让两个 Pod 各持一份互相看不见的向量数据 → 检索结果随机分叉（写入也只落在
  # 其中一份上）。因此在向量库外置（独立服务/共享存储）之前，后端**只能单副本**。
  replicas: 1
  # RWO 卷 + 单副本时，RollingUpdate 会出现"新 Pod 等旧 Pod 释放卷"的死锁，
  # 用 Recreate 明确"先停后起"（有短暂不可用，换取不会卡死）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: knowledge-backend
  template:
    metadata:
      labels:
        app: knowledge-backend
    spec:
      containers:
      - name: backend
        # 审计 §7.3-5：标签必须与 compose（1.0.1）/VERSION 一致；发布时建议
        # 改为按 digest 固定（image@sha256:...），避免 latest 漂移。
        image: ghcr.io/nanbuye-png/knowledge_chat/backend:1.0.1
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: knowledge-config
        - secretRef:
            name: knowledge-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: chroma
          mountPath: /app/chroma_db
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: knowledge-uploads
      - name: chroma
        persistentVolumeClaim:
          claimName: knowledge-chroma
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-backend
spec:
  selector:
    app: knowledge-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP