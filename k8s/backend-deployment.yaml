apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-backend
  labels:
    app: knowledge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-backend
  template:
    metadata:
      labels:
        app: knowledge-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/nanbuye-png/knowledge_chat/backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: knowledge-config
        - secretRef:
            name: knowledge-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        - name: chroma
          mountPath: /app/chroma_db
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: knowledge-uploads
      - name: chroma
        persistentVolumeClaim:
          claimName: knowledge-chroma
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-backend
spec:
  selector:
    app: knowledge-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP