apiVersion: v1
kind: Secret
metadata:
  name: knowledge-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "your-postgres-password"
  AGNES_API_KEY: "your-agnes-api-key"
  DEEPSEEK_API_KEY: "your-deepseek-api-key"
  # 必填：kubectl create secret generic knowledge-secrets \
  #         --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
  # 留空/占位串时，生产环境启动会 fail-fast 拒绝启动（审计 §6.1）。
  SECRET_KEY: ""