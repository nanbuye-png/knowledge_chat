apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-frontend
  labels:
    app: knowledge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-frontend
  template:
    metadata:
      labels:
        app: knowledge-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/nanbuye-png/knowledge_chat/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-frontend
spec:
  selector:
    app: knowledge-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: knowledge-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knowledge-frontend
            port:
              number: 80
  tls:
  - hosts:
    - your-domain.com
    secretName: knowledge-tls