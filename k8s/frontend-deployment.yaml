apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-frontend
  labels:
    app: knowledge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-frontend
  template:
    metadata:
      labels:
        app: knowledge-frontend
    spec:
      containers:
      - name: frontend
        # 与 compose / VERSION 对齐（审计 §7.3-5：此前 k8s 用 latest、compose 用 1.0.1）
        image: ghcr.io/nanbuye-png/knowledge_chat/frontend:1.0.1
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-frontend
spec:
  selector:
    app: knowledge-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledge-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # 审计 §7.3-4：ingress-nginx 默认 body 上限 1m，与会话上传的 50MB 不一致
    # → 大文件在入口就被 413。必须与 nginx/nginx.conf 的 client_max_body_size 对齐。
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: knowledge-backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knowledge-frontend
            port:
              number: 80
  tls:
  - hosts:
    - your-domain.com
    secretName: knowledge-tls